<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d89d3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud -->
  <path d="M 14 20 Q 12 20, 12 22 Q 12 24, 14 24 L 34 24 Q 36 24, 36 22 Q 36 20, 34 20 L 32 20 Q 32 16, 28 16 Q 26 16, 24 18 Q 22 16, 20 16 Q 16 16, 16 20 Z" 
        fill="url(#dlGrad)" opacity="0.6"/>
  
  <!-- Arrow -->
  <g fill="url(#dlGrad)">
    <!-- Shaft -->
    <rect x="21" y="18" width="6" height="16" rx="1"/>
    
    <!-- Arrow head -->
    <path d="M 24 38 L 16 30 L 20 30 L 24 34 L 28 30 L 32 30 Z"/>
  </g>
  
  <!-- Base line -->
  <rect x="12" y="40" width="24" height="3" rx="1.5" fill="url(#dlGrad)" opacity="0.8"/>
  
  <!-- Animated dots -->
  <circle cx="20" cy="14" r="1.5" fill="#4cc2ff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="12" r="1.5" fill="#4cc2ff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="14" r="1.5" fill="#4cc2ff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
