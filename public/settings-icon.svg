<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="settingsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3df0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d32dbf;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear -->
  <g fill="url(#settingsGrad)" opacity="0.8">
    <!-- Center circle -->
    <circle cx="24" cy="24" r="8"/>
    
    <!-- Gear teeth (8 teeth) -->
    <rect x="22" y="8" width="4" height="6" rx="1"/>
    <rect x="22" y="34" width="4" height="6" rx="1"/>
    <rect x="8" y="22" width="6" height="4" rx="1"/>
    <rect x="34" y="22" width="6" height="4" rx="1"/>
    
    <!-- Diagonal teeth -->
    <rect x="14" y="11" width="4" height="6" rx="1" transform="rotate(-45 16 14)"/>
    <rect x="30" y="11" width="4" height="6" rx="1" transform="rotate(45 32 14)"/>
    <rect x="14" y="31" width="4" height="6" rx="1" transform="rotate(45 16 34)"/>
    <rect x="30" y="31" width="4" height="6" rx="1" transform="rotate(-45 32 34)"/>
  </g>
  
  <!-- Inner hole -->
  <circle cx="24" cy="24" r="5" fill="none" stroke="#ff3df0" stroke-width="2"/>
  
  <!-- Rotation animation -->
  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 24 24"
    to="360 24 24"
    dur="8s"
    repeatCount="indefinite"/>
</svg>
